# Löscht hochgeladene Mecayo-Videos nach 3 Tagen (Metricool hat sie beim Einplanen schon übernommen).
name: cleanup-uploads
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["upload/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Alte Upload-Branches löschen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_DAYS: "3"
        run: |
          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%s)
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | grep '^upload/' | while read -r b; do
            d=$(gh api "repos/$REPO/commits/$b" --jq '.commit.committer.date')
            if [ "$(date -u -d "$d" +%s)" -lt "$cutoff" ]; then
              echo "lösche Branch $b ($d)"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
            fi
          done
